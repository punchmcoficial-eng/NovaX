<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaX • Verificación de Staff</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Space Grotesk', sans-serif; background: radial-gradient(circle at center, #18092e, #07070c 70%); color: #f4f4f5; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        nav { border-bottom: 1px solid rgba(112, 0, 255, 0.3); background: rgba(7, 7, 12, 0.85); padding: 18px 8%; }
        nav a { color: #d8b4fe; text-decoration: none; font-weight: 700; font-size: 1rem; }
        .box { max-width: 430px; width: 90%; margin: auto; background: #10101a; border: 1px solid rgba(112, 0, 255, 0.45); border-radius: 18px; padding: 34px; box-shadow: 0 0 40px rgba(112, 0, 255, 0.2); }
        h2 { font-size: 1.6rem; margin-bottom: 8px; }
        p { color: #a1a1aa; font-size: 0.92rem; margin-bottom: 20px; line-height: 1.5; }
        input { width: 100%; padding: 14px; border-radius: 12px; background: #181826; border: 1px solid #2e2e42; color: #fff; font-family: inherit; font-size: 1rem; outline: none; }
        input:focus { border-color: #a855f7; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(90deg, #7000ff, #00c3ff); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 16px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .error { color: #f87171; font-size: 0.85rem; margin-top: 10px; display: none; }
        footer { text-align: center; padding: 20px; color: #71717a; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav><a href="index.html">← Volver al inicio</a></nav>

    <div class="box">
        <h2>🛡️ Acceso de Staff</h2>
        <p>Ingresa la contraseña secreta de administración para entrar al Dashboard de <strong>Nova Midnight Club</strong>.</p>
        <input type="password" id="input-pass" placeholder="Escribe la contraseña..." onkeydown="if(event.key==='Enter') verificar()">
        <p id="error-msg" class="error">❌ Contraseña incorrecta. Verifica tu variable STAFF_PASS en Render.</p>
        <button class="btn" id="btn-entrar" onclick="verificar()">Verificar y Entrar →</button>
    </div>

    <footer>NovaX Security • Acceso Restringido</footer>

    <script>
        if (localStorage.getItem('nova_pass')) {
            window.location.href = 'dashboard.html';
        }

        async function verificar() {
            const pass = document.getElementById('input-pass').value.trim();
            const btn = document.getElementById('btn-entrar');
            const err = document.getElementById('error-msg');
            if (!pass) return;

            btn.textContent = 'Verificando...';
            err.style.display = 'none';

            const res = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-staff-pass': pass },
                body: JSON.stringify({ tipo: 'login' })
            }).catch(() => null);

            if (res && res.ok) {
                localStorage.setItem('nova_pass', pass);
                window.location.href = 'dashboard.html';
            } else {
                btn.textContent = 'Verificar y Entrar →';
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
